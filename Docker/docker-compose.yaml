



---

name: aim_test

services:

  aim_server:
    image: aim_server
    build:
      context: ./Docker/server
      args:
        - DOCKER_USER=${DOCKER_USER}
        - DOCKER_USER_ID=${DOCKER_USER_ID}
        - DOCKER_USER_GID=${DOCKER_USER_GID}
    # Share port for UI 43800
    expose:
      - 43800
      - 53800
    ports:
      - "43800:43800"
    # Share .aim volume
    volumes:
      - /tmp/aim_RR:/opt/aim
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://127.0.0.1:43800"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
  
  aim_worker:
    image: aim_test_worker
    build:
      context: ./Docker/worker
      args:
        - DOCKER_USER=${DOCKER_USER}
        - DOCKER_USER_ID=${DOCKER_USER_ID}
        - DOCKER_USER_GID=${DOCKER_USER_GID}
    command: ["bash", "-c", "pytest ~/test_files/test_aim_runs.py && sleep infinity"]
    # Share .aim volume
    # volumes:
    #   - postgres-db-volume:/opt/supervisord
    depends_on:
      aim_server:
        condition: service_healthy


